[package]
name = "mdm-store"
description = "MyDeployMate persistence: data directory, workspace file, run history, migrations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dirs = "7.0.0"
mdm-core = { version = "0.1.0", path = "../core" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"

[dev-dependencies]
mdm-core = { version = "0.1.0", path = "../core", features = ["fixtures"] }
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
