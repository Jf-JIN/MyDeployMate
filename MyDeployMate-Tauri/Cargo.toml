[workspace]
resolver = "3"
members = ["crates/core", "crates/store", "crates/exec", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
# Nothing is written to the console, so command arguments and secrets cannot end up in a
# terminal or a captured log (plan task 8.3). Tests may print; see clippy.toml.
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
