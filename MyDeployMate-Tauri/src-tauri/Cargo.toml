[package]
name = "mydeploymate"
description = "MyDeployMate desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mydeploymate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
mdm-core = { version = "0.1.0", path = "../crates/core" }
mdm-exec = { version = "0.1.0", path = "../crates/exec" }
mdm-store = { version = "0.1.0", path = "../crates/store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.12"
tauri-plugin-dialog = "2.7"
tauri-plugin-single-instance = "2"
thiserror = "2.0.21"
ts-rs = "12.0.1"

[build-dependencies]
tauri-build = "2"
