[package]
name = "ssh-spike"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
russh = { version = "0.64.1", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "3.0.1"
ssh-key = { version = "=0.7.0-rc.11", features = ["ppk", "encryption"] }
tokio = { version = "1.54.0", features = ["full"] }
