[package]
name = "win-spike"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
encoding_rs = "0.8.42"
keyring = "4.2.0"
process-wrap = { version = "10.0.1", features = ["std", "job-object"] }
russh = { version = "0.64.1", default-features = false, features = ["flate2", "ring", "rsa"] }
tokio = { version = "1.54.0", features = ["full"] }
