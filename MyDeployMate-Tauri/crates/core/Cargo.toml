[package]
name = "mdm-core"
description = "MyDeployMate domain model and validation (pure logic, no IO)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["uuid-impl", "serde-json-impl"] }
uuid = { version = "1.26.1", features = ["v7", "serde"] }

[dev-dependencies]
pretty_assertions = "1.4.1"

[features]
# Demo sample workspace for tests and UI development.
fixtures = []
