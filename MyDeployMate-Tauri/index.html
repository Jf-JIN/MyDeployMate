<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyDeployMate</title>
    <script>
      // Apply the theme before the first paint (UI-02); src/stores/theme.ts keeps it in sync.
      try {
        const pref = localStorage.getItem('mydeploymate.theme')
        const dark =
          pref === 'dark' ||
          (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
      // Same for the language (NFR-05), so the first paint uses the right font stack (UI-07);
      // src/stores/locale.ts keeps it in sync.
      try {
        const pref = localStorage.getItem('mydeploymate.locale')
        document.documentElement.lang =
          pref === 'zh-CN' || pref === 'en-US'
            ? pref
            : navigator.language.toLowerCase().startsWith('zh')
              ? 'zh-CN'
              : 'en-US'
      } catch {
        // Keep the default lang.
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
