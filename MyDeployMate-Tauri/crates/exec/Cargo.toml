[package]
name = "mdm-exec"
description = "MyDeployMate executors and run coordinator (phase 4+)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
encoding_rs = "0.8.42"
mdm-core = { version = "0.1.0", path = "../core" }
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "kill-on-drop"] }
russh = { version = "0.64.1", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "3.0.1"
secrecy = "0.10.3"
sha2 = "0.11.1"
ssh-key = { version = "=0.7.0-rc.11", features = ["ppk", "encryption"] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = "0.7.20"
zeroize = "1.9.1"

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "kill-on-drop", "job-object", "creation-flags"] }
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "kill-on-drop", "process-group"] }

[dev-dependencies]
mdm-core = { version = "0.1.0", path = "../core", features = ["fixtures"] }
mdm-store = { version = "0.1.0", path = "../store" }
pretty_assertions = "1.4.1"
secrecy = "0.10.3"
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.20"
